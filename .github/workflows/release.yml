name: Release

# Push a tag like v1.2.0 (matching package.json "version") to build the installer and portable exe
# and attach them to a draft GitHub Release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      # Build only: electron-builder publishes each target in parallel, and on a fresh tag that races
      # into two separate draft releases. One `gh release create` uploads both exes to one draft.
      - run: npm run dist
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/*-setup.exe release/*-portable.exe \
            --draft --title "Claude Usage Widget ${GITHUB_REF_NAME#v}" --generate-notes
